# Egress-Proxy für Agenten-Container: nur der Paketindex.
# UNGETESTET (21.10.2026). Direktiven an der Squid-Doku
# geprüft: acl, http_access, http_port.
http_port 3128
acl agentnetz src 172.30.0.0/24
acl SSL_ports port 443
acl erlaubt dstdomain pypi.org files.pythonhosted.org
http_access deny CONNECT !SSL_ports
http_access allow agentnetz erlaubt
http_access deny all
