[project]
name = "kapitel11-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-slim[openai]==2.57.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 64

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["adversarial", ".venv"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
