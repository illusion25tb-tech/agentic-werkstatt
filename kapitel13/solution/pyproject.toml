[project]
name = "kapitel13-solution"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
]

[tool.ruff]
line-length = 64

[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = ["fixtures", ".venv"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
