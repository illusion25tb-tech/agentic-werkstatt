[project]
name = "bestellservice"
version = "1.0.0"
description = "Bestell- und Versanddienst der Nordlicht Werkzeughandel GmbH (fiktiv)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.6",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 64
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with",
]
