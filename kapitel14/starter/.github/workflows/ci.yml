name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read          # gilt für alle Jobs
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.12"]
    defaults:
      run:
        working-directory: bestellservice
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
